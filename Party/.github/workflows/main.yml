name: CI/CD Pipeline for Class Microservice

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with pytest
        run: |
          pytest tests/

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t legend-class-service .

      - name: Deploy the service on a container
        run: docker run -d -p 5001:5001 --name class-service legend-class-service

      - name: Verify container is running
        run: |
          docker ps | grep class-service
          sleep 5 
          curl -f http://localhost:5001/hero/invalid_id || exit 0
