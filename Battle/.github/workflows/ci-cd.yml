name: Battle Service CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Step 1: Run all tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pvp_service/requirements.txt

      - name: Run tests
        run: python pvp_service/tests.py

  # Step 2: Build and push Docker image (only on main branch)
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/pvp-service:latest pvp_service/
          docker push ${{ secrets.DOCKER_USERNAME }}/pvp-service:latest

  # Step 3: Deploy to your server (only on main branch)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/pvp-service:latest
            docker stop pvp-service || true
            docker rm pvp-service || true
            docker run -d --name pvp-service -p 5003:5003 --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/pvp-service:latest
